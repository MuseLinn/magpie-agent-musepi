name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/*.test.mjs"
      # A tag must name the version it publishes, so npm and the GitHub
      # release can never drift apart.
      - name: Check the tag names this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name package.json's $version"
            exit 1
          fi
      # Trusted publishing over OIDC: npm matches this repository and workflow,
      # so nothing is stored. NPM_TOKEN is only a fallback for a repository
      # without a trusted publisher — bypass-2FA tokens stop publishing
      # directly around January 2027. A fork has neither and is skipped.
      - name: Publish to npm
        if: github.repository == 'MuseLinn/magpie-agent-musepi'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --access public --provenance
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes